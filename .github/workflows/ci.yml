name: Offline Responsible AI Kit CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and security boundary tests (offline)
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Example policy validation (offline)
        run: PYTHONPATH=src python -m trustelis_rai validate --policy examples/refund_agent/policy.json
      - name: Example action check (offline)
        run: PYTHONPATH=src python -m trustelis_rai check --policy examples/refund_agent/policy.json --request examples/refund_agent/request_allowed.json
      - name: Illustrative preflight execution (offline)
        run: PYTHONPATH=src python examples/refund_agent/demo.py
      - name: Developer-defined factor plugin (offline)
        run: PYTHONPATH=src python examples/custom_factor.py
